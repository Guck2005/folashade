<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"
      integrity="sha512-f8mwTB+Bs8a5c46DEm7HQLcJuHMBaH/UFlcgyetMqqkvTcYg4g5VXsYR71b3qC82lZytjNYvBj2pf0VekA9/FQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body class="is-loading">
    <div
      id="page-loader"
      class="page-loader"
      aria-busy="true"
      aria-live="polite"
      aria-label="Chargement"
    >
      <div class="overlay">
        <div class="block block-1"></div>
        <div class="block block-2"></div>
        <div class="block block-3"></div>
        <div class="block block-4"></div>
        <div class="block block-5"></div>
        <div class="block block-6"></div>
        <div class="block block-7"></div>
        <div class="block block-8"></div>
        <div class="block block-9"></div>
        <div class="block block-10"></div>
        <div class="block block-11"></div>
        <div class="block block-12"></div>
        <div class="block block-13"></div>
        <div class="block block-14"></div>
        <div class="block block-15"></div>
        <div class="block block-16"></div>
        <div class="block block-17"></div>
        <div class="block block-18"></div>
        <div class="block block-19"></div>
        <div class="block block-20"></div>
      </div>
    </div>
    <div class="loader" aria-hidden="true">Chargement</div>
    <header class="navbar">
      <a class="navbar__brand" href="#accueil">
        <span class="navbar__brand-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 1.5l2.6 6.4 6.9.5-5.3 4.5 1.6 6.8L12 16.9 7.2 19.7l1.6-6.8-5.3-4.5 6.9-.5L12 1.5z"
            />
          </svg>
        </span>
        <span class="navbar__brand-text">Hamidath</span>
      </a>
      <button
        type="button"
        class="navbar__toggle"
        id="menu-toggle"
        aria-expanded="false"
        aria-controls="menu-principal"
        aria-label="Ouvrir le menu"
      >
        <span class="navbar__toggle-box" aria-hidden="true">
          <span class="navbar__toggle-bar"></span>
          <span class="navbar__toggle-bar"></span>
          <span class="navbar__toggle-bar"></span>
        </span>
      </button>
      <div
        class="navbar__backdrop"
        id="menu-backdrop"
        aria-hidden="true"
      ></div>
      <div class="navbar__panel" id="menu-principal">
        <nav class="navbar__nav" aria-label="Navigation principale">
          <a href="#accueil">Accueil</a>
          <a href="#projets">Projets</a>
        </nav>
        <a class="navbar__cta" href="#contact">Me contacter</a>
      </div>
    </header>

    <section class="hero" id="accueil" aria-label="Accueil">
      <div class="hero__bg" aria-hidden="true"></div>
      <div class="hero__grid" aria-hidden="true"></div>
      <div class="hero__content">
        <div class="hero__photo-wrap">
          <div class="box" aria-hidden="true"></div>
          <img
            class="hero__photo img"
            src="assets/images/hamidath_photo.png"
            alt="Portrait"
            width="480"
            height="480"
            fetchpriority="high"
            decoding="async"
          />
        </div>
      </div>
      <div class="hero__mist" aria-hidden="true"></div>
      <div class="hero__headline">
        <p class="hero__kicker">Je suis FOLASHADÉ</p>
        <h1 class="hero__heading">Développeur Fullstack</h1>
      </div>
      <a class="hero__projects" href="#projets">Mes projets</a>
    </section>
    <script src="main.js" defer></script>
  </body>
</html>
